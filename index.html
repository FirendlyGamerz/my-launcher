<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Launcher</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="app">

        <!-- Sidebar -->
        <aside class="sidebar">

            <div class="sidebar-header">
                <h1>My Launcher</h1>
            </div>

            <nav class="sidebar-nav">

                <a href="#" class="nav-item active">
                    <span>Home</span>
                </a>

                <a href="#" class="nav-item">
                    <span>Favorites</span>
                </a>

                <a href="#" class="nav-item">
                    <span>Websites</span>
                </a>

                <a href="#" class="nav-item">
                    <span>Web Apps</span>
                </a>

                <a href="#" class="nav-item">
                    <span>Applications</span>
                </a>

                <a href="#" class="nav-item">
                    <span>Settings</span>
                </a>

            </nav>

            <div class="sidebar-bottom">

                <button class="add-button" id="add-button">
                    + Add
                </button>

            </div>

        </aside>


        <!-- Main Content -->
        <main class="main-content">

            <!-- Top Bar -->
            <header class="top-bar">

                <div class="search-container">

                    <input type="search" id="search-input" placeholder="Search...">

                </div>

            </header>


            <!-- Dashboard -->
            <section class="dashboard">

                <div class="dashboard-header">

                    <h2>Home</h2>

                    <p>Your launcher dashboard</p>

                </div>


                <!-- Favorites -->
                <section class="launcher-section">

                    <div class="section-header">

                        <h3>Favorites</h3>

                    </div>

                    <div class="app-grid">

                        <!-- Launcher cards will be added here later -->

                    </div>

                </section>


                <!-- Websites -->
                <section class="launcher-section">

                    <div class="section-header">

                        <h3>Websites</h3>

                    </div>

                    <div class="app-grid">

                        <!-- Website cards will be added here later -->

                    </div>

                </section>


                <!-- Web Apps -->
                <section class="launcher-section">

                    <div class="section-header">

                        <h3>Web Apps</h3>

                    </div>

                    <div class="app-grid">

                        <!-- Web app cards will be added here later -->

                    </div>

                </section>


                <!-- Windows Applications -->
                <section class="launcher-section">

                    <div class="section-header">

                        <h3>Applications</h3>

                    </div>

                    <div class="app-grid">

                        <!-- Windows application cards will be added here later -->

                    </div>

                </section>

            </section>

        </main>
        <div class="add-dialog" id="add-dialog">

            <div class="dialog-box">

                <div class="dialog-header">
                    <h3>Add Item</h3>
                    <button class="close-button" id="close-dialog">&times;</button>
                </div>

                <div class="dialog-content">
                    <p>Choose what you want to add.</p>

                    <div class="item-type-selection">

                        <button class="item-type-button" id="website-button">
                            Website
                        </button>

                        <button class="item-type-button">
                            Web App
                        </button>

                        <button class="item-type-button">
                            Windows Application
                        </button>

                    </div>
                    <form class="item-form" id="website-form">

                        <div class="form-group">

                            <label for="website-name">
                                Name
                            </label>

                            <input type="text" id="website-name" placeholder="e.g. YouTube" required>

                        </div>


                        <div class="form-group">

                            <label for="website-url">
                                URL
                            </label>

                            <input type="url" id="website-url" placeholder="https://example.com" required>

                        </div>


                        <div class="form-group">

                            <label>
                                <input type="checkbox" id="website-favorite">

                                Add to Favorites
                            </label>

                        </div>


                        <div class="form-actions">

                            <button type="button" id="cancel-website">
                                Cancel
                            </button>

                            <button type="submit" id="save-website">
                                Save
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>


    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
